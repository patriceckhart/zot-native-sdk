name: CI
on: [push, pull_request]

jobs:
  go:
    strategy:
      matrix: { os: [macos-15, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go test ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - run: go vet ./...
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      - run: bun run build
      - run: |
          for package in packages/core packages/electron packages/native-sdk packages/react-native packages/tauri; do
            (cd "$package" && bun pm pack --dry-run)
          done
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --manifest-path crates/tauri-plugin-zot/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path crates/tauri-plugin-zot/Cargo.toml
      - run: cargo package --locked --allow-dirty --manifest-path crates/tauri-plugin-zot/Cargo.toml
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - working-directory: packages/flutter
        run: flutter pub get && flutter analyze
      - working-directory: packages/flutter
        run: dart pub publish --dry-run
